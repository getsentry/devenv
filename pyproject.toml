[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentry_devenv"
version = "1.30.1"
authors = [
  { name="Joshua Li", email="joshua.li@sentry.io" },
  { name="Ian Woodard", email="ian.woodard@sentry.io" },
  { name="Buck Evan", email="buck.evan@sentry.io" },
]
description = "Utilities for setting up a Sentry development environment"
readme = "README.md"
# a range, not the exact pin, so repos like sentry can install devenv into
# their own 3.13 venvs and internal pypi can build it.
# .python-version pins devenv's own interpreter.
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
  "typing_extensions",
  "sentry-sdk",
]

[tool.setuptools.package-data]
"devenv" = ["py.typed"]

[tool.setuptools.packages]
find = {}

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-select = ["ANN", "PYI"]
preview = true
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
skip-magic-trailing-comma = true


[project.scripts]
devenv = "devenv.main:main"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[dependency-groups]
dev = [
  "coverage",
  "covdefaults",
  "prek",
  "pytest",
  "re-assert",
  "ruff",
  "shellcheck-py",
  "ty",
]

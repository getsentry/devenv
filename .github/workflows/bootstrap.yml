name: bootstrap
on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    # enable xtrace by default
    # use a login shell, to enable ~/.profile
    # the default default is:
    #      bash --noprofile --norc -eo pipefail {0}
    shell: bash --login -eo pipefail -x {0}
env:
  SHELL: /bin/bash
  PYTHONUNBUFFERED: "1"
  DEBUG: "1"

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEVENV_FETCH_BRANCH: master
      SNTY_DEVENV_BRANCH:
        "${{ github.event.pull_request && github.head_ref || github.ref_name }}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # devenv no longer manages uv; linux users need to install it themselves
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.5

      - name: install
        run: |
          set -u
          : should be able to be run from anywhere:
          repo=$PWD
          mv install-devenv.sh /tmp
          cd /tmp
          ./install-devenv.sh  < $repo/ci/install-devenv-checks.sh
      - name: bootstrap sentry
        run: ./ci/devenv-bootstrap.sh

  bootstrap-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVENV_FETCH_BRANCH: master
      SNTY_DEVENV_BRANCH:
        "${{ github.event.pull_request && github.head_ref || github.ref_name }}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # devenv no longer manages uv; explicitly pin it, as sentry's sync
      # uses whatever uv is on PATH and brew's is too old to provision
      # the Python that sentry requires
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.5

      - name: remove homebrew
        run: |
          sudo rm -rf \
              /usr/local/var/homebrew \
              /usr/local/bin/brew /usr/local/Homebrew /usr/local/Cellar /usr/local/Caskroom \
              /usr/local/bin/pydoc* /usr/local/bin/python* /usr/local/bin/pip* /usr/local/bin/2to3* /usr/local/bin/idle3* \
              /usr/local/bin/chromedriver
      - name: install
        run: |
          set -u
          : should be able to be run from anywhere:
          repo=$PWD
          mv install-devenv.sh /tmp
          cd /tmp
          ./install-devenv.sh  < $repo/ci/install-devenv-checks.sh
      - name: pin uv for sentry sync
        run: |
          # sentry's sync uses whatever uv is first on PATH, and its
          # post_fetch brew-installs a stale uv later in this job, so
          # pin the workflow's uv where devenv's bin dir wins on PATH
          ln -sfn "$(command -v uv)" "${HOME}/.local/share/sentry-devenv/bin/uv"
          uv --version
      - name: bootstrap sentry
        run: ./ci/devenv-bootstrap.sh || cat /Users/runner/.colima/_lima/colima/ha.stderr.log
